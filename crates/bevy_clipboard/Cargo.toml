[package]
name = "bevy_clipboard"
version = "0.20.0-dev"
edition = "2024"
description = "Provides clipboard support for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "clipboard"]

[features]
default = []
system_clipboard = ["dep:arboard"]
image = [
  "system_clipboard",
  "dep:bevy_asset",
  "dep:bevy_image",
  "dep:wgpu-types",
  "arboard/image-data",
]
# On Wayland, `arboard`'s data-control protocols, preferred for the same clipboard access as
# on other platforms, and the core protocol on the app's own connection where the app may
# not use data-control.
wayland = [
  "arboard?/wayland-data-control",
  "dep:smithay-clipboard",
  "dep:wayland-client",
  "dep:wayland-backend",
  "dep:bevy_window",
  "bevy_window/std",
  "dep:raw-window-handle",
]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev", default-features = false }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev", default-features = false }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev", default-features = false }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev", default-features = false }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev", default-features = false, optional = true }

# other
raw-window-handle = { version = "0.6", default-features = false, optional = true }

[target.'cfg(any(windows, unix))'.dependencies]
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev", default-features = false, optional = true }
bevy_image = { path = "../bevy_image", version = "0.20.0-dev", default-features = false, optional = true }
wgpu-types = { version = "30", default-features = false, optional = true }
arboard = { version = "3.6.1", default-features = false, optional = true }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
smithay-clipboard = { version = "0.7.3", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
